train_steps: 1000000
eval_freq: 25000
eval_episodes: 10
checkpoint_freq: 50000
batch_size: 64

seeds: 42
n_seeds: 5

wandb_project: td3-bc-cartpole
checkpoint_dir: ./checkpoints

#experiment_name: <optional>

dataset_path: dmc/cartpole_swingup-alg_ppo-act_4-seg_0-rnd_0/expert-v0

env_name: dmc_cartpole_swingup_1-v1
num_envs: 1
env_kwargs:
  channels_first: True
  height: 64
  width: 64
  action_repeat: 4
  #is_train: False
frame_stack: 3

train_mode:
  type: pretrain

  td3_config:
    discount: 0.99
    tau: 0.005
    policy_noise: 0.2
    noise_clip: 0.5
    alpha: 0.4
    actor_lr: 3e-4
    critic_lr: 3e-4
    policy_freq: 2

    policy_config:
      type: cnn
      
      cnn_encoder_cfg:
        cnn_filter_dims: [32, 64, 128, 256]
        cnn_kernel_strides: [2, 2, 1, 1]

      actor_cfg:
        linear_trunk_dim: 64
        hidden_dim: 256
        n_layers: 2

      critic_cfg:
        linear_trunk_dim: 64
        hidden_dim: 256
        n_layers: 2