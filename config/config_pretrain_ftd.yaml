train_steps: 1000000
eval_freq: 1000
eval_episodes: 0
checkpoint_freq: 25000
batch_size: 16

seeds: 42
n_seeds: 5

wandb_project: td3-bc
checkpoint_dir: ./checkpoints

#experiment_name: <optional>

dataset_path: dmc_distraction/dmc_distraction_cheetah_run_1-v1/medium-v0

env_name: dmc_distraction_cheetah_run_1-v1
num_envs: 1

train_mode:
  type: pretrain_ftd

  td3_config:
    discount: 0.99
    tau: 0.005
    policy_noise: 0.2
    noise_clip: 0.5
    alpha: 0.4
    actor_lr: 3e-4
    critic_lr: 3e-4
    policy_freq: 2

    policy_config:
      type: ftd
      num_regions: 10
      num_channels: 3
      num_stack: 1
      num_selector_layers: 5
      num_filters: 32
      embed_dim: 128
      num_attention_heads: 4
      num_shared_layers: 11
      num_head_layers: 0
      projection_dim: 100